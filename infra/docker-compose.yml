# Local stack. From the repo root:
#   docker compose -f infra/docker-compose.yml up -d                     # Postgres + Redis only
#   docker compose -f infra/docker-compose.yml --profile app up -d       # + api, worker, dashboard
#   docker compose -f infra/docker-compose.yml --profile filter up -d    # + learned-filter service
# Apply migrations first: DATABASE_URL=postgresql://reviewlens:reviewlens@localhost:5432/reviewlens pnpm db:migrate
#   docker compose -f infra/docker-compose.yml --profile tracing up -d   # + Jaeger (UI on :16686)
name: reviewlens

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reviewlens
      POSTGRES_PASSWORD: reviewlens
      POSTGRES_DB: reviewlens
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reviewlens -d reviewlens']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction: evicted keys would silently lose jobs.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
      args: { APP: api }
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://reviewlens:reviewlens@postgres:5432/reviewlens
    ports: ['3000:3000']
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  worker:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
      args: { APP: worker }
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://reviewlens:reviewlens@postgres:5432/reviewlens
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_key
      # Used only when REVIEW_FILTER_THRESHOLD is set (start the filter profile too).
      FILTER_URL: http://filter:8000
    secrets: [github_app_key]
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  dashboard:
    profiles: [app]
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
      args: { APP: dashboard }
    command: ['node', 'dist/server/main.js']
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://reviewlens:reviewlens@postgres:5432/reviewlens
      # Inside a container the dashboard must listen beyond loopback, so it needs a password.
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?set DASHBOARD_PASSWORD in .env}
      RESULTS_DIR: /results
    volumes:
      - ../eval/results:/results:ro
    # Published on loopback only; put a TLS reverse proxy in front to expose it.
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: { condition: service_healthy }

  filter:
    profiles: [filter]
    build:
      context: ..
      dockerfile: infra/docker/filter.Dockerfile
    ports: ['127.0.0.1:8000:8000']

  jaeger:
    profiles: [tracing]
    image: jaegertracing/jaeger:latest
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP over HTTP

secrets:
  github_app_key:
    file: ../reviewlens.private-key.pem

volumes:
  pgdata:
  redisdata:
