name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reviewlens/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Build resolves workspace packages through their emitted .d.ts (not sources),
      # so it can catch type errors that typecheck does not.
      - run: pnpm build

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eval/benchmark
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pytest ruff mypy
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -q

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pytest ruff mypy pyyaml types-PyYAML matplotlib
      - name: Harness lint, types and unit tests
        working-directory: eval/harness
        run: ruff check . && ruff format --check . && mypy && pytest -q
      # Ten synthetic bugs through the real CLI with scripted comments; no model is called.
      - run: make eval-smoke
