name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reviewlens/db generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Build resolves workspace packages through their emitted .d.ts (not sources),
      # so it can catch type errors that typecheck does not.
      - run: pnpm build
      # Nothing server-side may end up in code shipped to browsers.
      - name: Client bundle holds no secrets or server-only settings
        run: node scripts/secret-scan.mjs --paths apps/dashboard/dist/client --deny-names
      # Prompt-injection, secret-leak and tag-breakout cases against the real prompt builder.
      # No model is called; `node scripts/redteam.mjs --live` adds the model-output checks.
      - name: Red-team prompt checks
        run: node scripts/redteam.mjs

  # Known vulnerabilities in what ships. Dev-only tooling is reported, not blocking.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit || true

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: eval/benchmark
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pytest ruff mypy
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest -q

  # Secrets in any commit on any branch, with gitleaks' default rules. Findings are redacted.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --redact --verbose --exit-code 1
      - name: Repository scanner (tracked files and history)
        run: node scripts/secret-scan.mjs && node scripts/secret-scan.mjs --history

  # The deployable images build from a clean checkout. Not pushed anywhere.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/docker/node.Dockerfile --build-arg APP=${{ matrix.app }} -t reviewlens-${{ matrix.app }} .
      - name: The image contains its build output
        run: docker run --rm --entrypoint sh reviewlens-${{ matrix.app }} -c 'test -d dist && ls dist'

  filter-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/docker/filter.Dockerfile -t reviewlens-filter .

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: >-
          pip install pytest ruff mypy pyyaml types-PyYAML matplotlib
          numpy scikit-learn lightgbm fastapi uvicorn httpx
      - name: Harness lint, types and unit tests
        working-directory: eval/harness
        run: ruff check . && ruff format --check . && mypy && pytest -q
      # Ten synthetic bugs through the real CLI with scripted comments; no model is called.
      - run: make eval-smoke
      # Includes the split-hygiene tests: training and evaluation repositories stay apart.
      - name: Filter lint, types and unit tests
        working-directory: services/filter
        run: ruff check . && ruff format --check . && mypy && pytest -q
      # A synthetic model served over HTTP and scored against through the real CLI.
      - run: make filter-smoke
