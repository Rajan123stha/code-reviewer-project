name: E1-strategies
description: >-
  Context strategies S0 to S5 with the model, token budget and prompt held constant (RQ1).
manifest: ../../benchmark/manifests/benchmark-a.v1.json
cases:
  sample: 60 # review inputs, sampled round-robin across repositories
  seed: 1
  exclude_invalid: true
runs: 3 # repeats per arm, to measure LLM nondeterminism
k: [1, 3, 5, 10]
matching:
  line_tolerance: 3
# Held constant in every arm. One pinned model with no fallback, so every result is
# attributable to it; low effort keeps a sweep affordable on free-tier quotas.
base:
  model: gemini-3.5-flash
  fallbackModels: []
  effort: low
baseline: S0
arms:
  - { id: S0, strategy: S0 }
  - { id: S1, strategy: S1 }
  - { id: S2, strategy: S2 }
  - { id: S3, strategy: S3 }
  - { id: S4, strategy: S4 }
  - { id: S5, strategy: S5 }
