name: E5-filter
description: >-
  S4 with the learned usefulness filter off and at several score thresholds (RQ3).
# The filter service arrives in Phase 7; the harness refuses to run this until then.
requires: [filter]
manifest: ../../benchmark/manifests/benchmark-a.v1.json
cases:
  sample: 60 # review inputs, sampled round-robin across repositories
  seed: 1
  exclude_invalid: true
runs: 3 # repeats per arm, to measure LLM nondeterminism
k: [1, 3, 5, 10]
matching:
  line_tolerance: 3
# Held constant in every arm. One pinned model with no fallback, so every result is
# attributable to it; low effort keeps a sweep affordable on free-tier quotas.
base:
  model: gemini-3.5-flash
  fallbackModels: []
  effort: low
baseline: no-filter
arms:
  - { id: no-filter, strategy: S4, config: { filterThreshold: null } }
  - { id: filter-0.3, strategy: S4, config: { filterThreshold: 0.3 } }
  - { id: filter-0.5, strategy: S4, config: { filterThreshold: 0.5 } }
  - { id: filter-0.7, strategy: S4, config: { filterThreshold: 0.7 } }
